<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Babylon Racer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a; }
      #c { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #hud {
        position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom));
        font: 600 44px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #eef2f6; text-shadow: 0 2px 10px rgba(0,0,0,.55);
        text-align: right; pointer-events: none;
      }
      #hud small { display: block; font-size: 13px; font-weight: 500; opacity: .65; letter-spacing: .12em; }

      /* score: top left, out of the way of the speed readout and the sticks */
      #score {
        position: fixed; pointer-events: none; color: #eef2f6;
        left: calc(22px + env(safe-area-inset-left));
        top: calc(18px + env(safe-area-inset-top));
        font-variant-numeric: tabular-nums;
      }
      #score > span { font: 700 42px/1 ui-monospace, monospace; letter-spacing: -.02em; }
      #score > small { display: block; font: 500 12px/1.4 ui-monospace, monospace; opacity: .6; letter-spacing: .14em; margin-top: 2px; }
      #chain {
        font: 700 22px/1 ui-monospace, monospace;
        margin-top: 14px; color: #ffc450; opacity: 0;
        transition: opacity .18s ease;
      }
      #chain.live { opacity: 1; text-shadow: 0 0 18px rgba(255,196,80,.5); }
      #chain.banks { opacity: 1; color: #8fe08f; }
      #chain i { font-style: normal; font-size: 15px; opacity: .8; }
      #slip {
        font: 600 13px/1 ui-monospace, monospace; opacity: .55;
        margin-top: 8px; letter-spacing: .08em; display: block;
      }
      body.touch #score { left: calc(14px + env(safe-area-inset-left)); top: calc(12px + env(safe-area-inset-top)); }
      body.touch #score > span { font-size: 30px; }
      body.touch #chain { font-size: 18px; margin-top: 8px; }
      #err {
        position: fixed; inset: 0; display: none; padding: 24px;
        font: 14px/1.5 ui-monospace, monospace; color: #ffd7d7; background: #2a1114; white-space: pre-wrap;
      }

      /* touch controls: nothing is shown until a finger actually touches the
         glass, so a desktop with a touchscreen never sees them */
      #touch { position: fixed; inset: 0; pointer-events: none; }
      #touch[hidden] { display: none; }
      #stick {
        position: absolute; pointer-events: auto;
        left: calc(18px + env(safe-area-inset-left));
        bottom: calc(24px + env(safe-area-inset-bottom));
        width: 118px; height: 118px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,.04) 62%, rgba(255,255,255,.02));
        border: 1px solid rgba(255,255,255,.22);
        touch-action: none; user-select: none; -webkit-user-select: none;
        display: grid; place-items: center;
      }
      #stick.live { border-color: rgba(255,196,80,.85); background: radial-gradient(circle, rgba(255,196,80,.16), rgba(255,255,255,.04) 62%); }
      #knob {
        width: 54px; height: 54px; border-radius: 50%;
        background: rgba(238,242,246,.82);
        box-shadow: 0 2px 12px rgba(0,0,0,.45);
        will-change: transform;
      }
      #hb {
        position: absolute; pointer-events: auto;
        right: calc(20px + env(safe-area-inset-right));
        bottom: calc(28px + env(safe-area-inset-bottom));
        width: 96px; height: 96px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,.24);
        background: rgba(255,255,255,.06); color: #eef2f6;
        font: 600 12px/1 ui-monospace, monospace; letter-spacing: .1em;
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #hb.on { background: rgba(255,96,80,.55); border-color: rgba(255,140,120,.9); }

      /* the hands live at the bottom of a phone, so the readout moves up there */
      body.touch #hud {
        top: calc(14px + env(safe-area-inset-top));
        bottom: auto; right: 16px; font-size: 30px;
      }
      body.touch #hud small { font-size: 11px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="score">
      <span id="pts">0</span><small>POINTS</small>
      <div id="chain"><span id="ch">0</span> <i>x<span id="mul">1.0</span></i></div>
      <span id="slip"></span>
    </div>
    <div id="hud"><span id="spd">0</span><small>KM/H · <span id="gear">N</span></small></div>
    <div id="touch" hidden>
      <div id="stick"><div id="knob"></div></div>
      <button id="hb" type="button" aria-label="handbrake">BRAKE</button>
    </div>
    <pre id="err"></pre>
    <script>
      window.addEventListener("error", (e) => {
        const el = document.getElementById("err");
        el.style.display = "block";
        el.textContent = "BUILD ERROR\n" + (e.message || e.error) + "\n" + (e.filename || "");
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
